<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Oficina de uso consciente de IA: compare respostas sem contexto e com fontes, e aprenda a conferir." />
    <title>Educagente · Oficina de IA com fontes</title>
    <script>
      // Aplica tamanho e tema salvos antes de desenhar a página (evita piscar).
      try {
        var p = JSON.parse(localStorage.getItem('educagente:preferencias') || '{}')
        if (p.tamanho) document.documentElement.dataset.tamanho = p.tamanho
        if (p.tema) document.documentElement.dataset.tema = p.tema
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Esta oficina precisa de JavaScript ligado no navegador.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
